# Streamlit native theme. See DESIGN.md §2 for the tokens and §10.5 for charts.
#
# `base` is "dark" as of the visual-system redesign. It used to be pinned to
# "light" because pages 2-6 each shipped their own light stylesheet with an
# `!important` override on `.stApp`: flipping would have left their surfaces
# light while Streamlit recoloured the native widget text near-white —
# white-on-white. Those five stylesheets are gone; every page now calls
# `ui._design.inject_design()`.
#
# Pages 1 and 7 inject no CSS at all, so they are pure native widgets and take
# their appearance entirely from this file. The values below therefore have to
# agree with ui/_design.py's dark token binding — that is what makes those two
# pages match the rest of the app rather than sitting on Streamlit's own
# #0e1117.
[theme]
base = "dark"

# Must track the dark binding in ui/_design.py.
backgroundColor          = "#0c1015"   # --bg
secondaryBackgroundColor = "#13181e"   # --surface
textColor                = "#edeff1"   # --ink
borderColor              = "#31363d"   # --border
linkColor                = "#9085e9"   # --brand-text (5.71:1 — AA)

# Indigo/violet — tints native focus rings, slider tracks, checkbox ticks and
# radio dots. Must track --brand.
primaryColor = "#6d5cf0"

baseRadius   = "0.4rem"
buttonRadius = "0.4rem"

# Streamlit's basic colour palette, used by st.success / st.warning / st.error,
# st.badge and markdown colour syntax. Mapped onto the locked semantic roles so
# native feedback matches the design system instead of fighting it. Streamlit
# derives each matching *BackgroundColor at 20% on dark, which is what the
# hand-written --*-wash tokens already do.
greenColor  = "#5bcc80"   # --value  · positive EV
yellowColor = "#ebae51"   # --amber  · caution / each-way
redColor    = "#ec5448"   # --danger · loss / negative
blueColor   = "#549de5"   # --info   · probability, links
violetColor = "#6d5cf0"   # --brand

# Dataframes paint to a <canvas> that CSS cannot reach, so their chrome has to
# be declared here.
dataframeHeaderBackgroundColor = "#1b2128"   # --surface-2
dataframeBorderColor           = "#31363d"   # --border

# Chart identity, applied by Streamlit to Plotly, Altair AND Vega-Lite. The
# validated colourblind-safe categorical palette from DESIGN.md §2.3 — five
# hues, fixed order. It deliberately contains no green, amber or red: those are
# reserved semantics, and a chart where green means "the second thing I plotted"
# misleads on a surface where green means "this bet has edge".
#
# The specified charts set an explicit `colorway` via
# ui._design.plotly_layout(), which still wins. This is the default for the rest.
chartCategoricalColors = ["#9085e9", "#d95926", "#199e70", "#3987e5", "#d55181"]

# One hue, light -> dark, for continuous magnitude.
chartSequentialColors = [
  "#eceafc", "#d9d5f8", "#c3bcf6", "#a99fef", "#8f82e9",
  "#7768e0", "#6152cf", "#4d40ab", "#3d3293", "#2e2570",
]

# Two hues plus a NEUTRAL grey midpoint — never a hue at the middle.
chartDivergingColors = [
  "#4d40ab", "#6759d2", "#8a7de8", "#b3abf2", "#d8d4f8",
  "#f2ccb8", "#eaa77f", "#e08a4f", "#d95926", "#a8410f",
]

# NOTE: there is deliberately no [theme.sidebar] section. It used to pin
# textColor = "#c8d3e8" to keep the nav legible on the old dark-navy sidebar
# while the app ran on a light base. Under a dark base the sidebar text is
# already light, so it earns nothing — and it would force light text onto any
# light surface. ui/_design.py paints the sidebar in both modes.

[server]
# Serve ui/static/* at /app/static/* so the dawn-racecourse hero photo can be a
# CSS background with a gradient scrim (see ui/_design.py hero/empty state).
enableStaticServing = true
